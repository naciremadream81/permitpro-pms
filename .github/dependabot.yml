version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    ignore:
      # eslint-config-next@16 is not compatible with ESLint 10 yet (see PR #102).
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    groups:
      framework:
        patterns: [next, eslint, eslint-config-next, react, react-dom, '@types/react', '@types/react-dom']
      prisma:
        patterns: [prisma, '@prisma/*']
      archives:
        patterns: [archiver, '@types/archiver']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/New_York
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
